services:

  postgres:
    image: postgres:16-alpine
    container_name: jobops-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  backend:
    build:
      context: ./backend

    container_name: jobops-backend

    restart: unless-stopped

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL}

    ports:
      - "${BACKEND_PORT}:8000"

    volumes:
      - ./backend:/app

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  frontend:
    build:
      context: ./frontend

    container_name: jobops-frontend

    restart: unless-stopped

    environment:
      BACKEND_URL: http://backend:8000

    ports:
      - "${FRONTEND_PORT}:8501"

    volumes:
      - ./frontend:/app

    depends_on:
      backend:
        condition: service_healthy


  n8n:
    image: n8nio/n8n:latest

    container_name: jobops-n8n

    restart: unless-stopped

    ports:
      - "${N8N_PORT}:5678"

    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}

      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http

      WEBHOOK_URL: http://localhost:${N8N_PORT}/

    volumes:
      - n8n_data:/home/node/.n8n

    depends_on:
      postgres:
        condition: service_healthy


volumes:

  postgres_data:

  n8n_data: